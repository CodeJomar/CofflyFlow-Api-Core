name: CI

on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · tipos, lint, build, pruebas y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coffy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias (determinista)
        run: npm ci
      - name: Tipos
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Pruebas de seguridad
        run: npm test
      - name: Pruebas con base de datos (PostgreSQL temporal)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/coffy
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
