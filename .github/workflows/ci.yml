name: CI

on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · tipos, lint, build y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias (determinista)
        run: npm ci
      - name: Tipos
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
