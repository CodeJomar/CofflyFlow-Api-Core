name: Commits

on:
  pull_request:
    branches: [develop, prod]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Mensajes de commit (tipo(ámbito) descripción)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.mjs
